[relay]
host = 0.0.0.0
port = 3333
host_key = host_ed25519
token_file = relay-token.txt
workers = 4
buffer_kib = 64
; Extra relay compression only. SSH/WebRTC encryption remains enabled.
; off: raw game forwarding (default); auto: opt in to negotiated Zstandard.
compression = off
max_connections = 512
max_rooms = 128
max_streams_per_room = 128
max_total_streams = 512
max_streams_per_client = 8

; Managed deployments use the C++ control service; see docs/12.
; Create keys, proof TLS and config using scripts/configure_node.py.
; [web] serves ownership proof/health only, with no login or administration.
; Custom/self-hosted control services use the same configuration.
[control]
mode = native
; Required inputs (replace placeholders):
; origin = https://control.example.org
; ca_file = control-ca.pem
; signing_public_key = <64 hexadecimal public-key characters>
; credential_file = control-enrollment
; endpoint = relay.example.org:443
; proof_endpoint = relay.example.org:443
; region = cn-north
; operator = unknown
; slots = 32
; bandwidth = 6000000
