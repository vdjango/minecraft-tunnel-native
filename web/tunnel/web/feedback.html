<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>问题反馈 · Buggcraft</title><script src="/theme.js"></script><link rel="stylesheet" href="/portal.css"><link rel="stylesheet" href="/console.css"><link rel="stylesheet" href="/theme.css"><script src="/common.js" defer></script><script src="/feedback.js" defer></script></head><body class="user-site">{{SITE_HEADER}}<main class="shell user-main"><div class="{{LAYOUT_CLASS}}">{{ADMIN_NAV}}<div class="management-main"><div class="page-heading"><span class="eyebrow">COMMUNITY FEEDBACK</span><h1 id="feedback-title">问题反馈</h1><p>提交遇到的问题，一起跟进处理进度。</p></div><p id="feedback-message" class="feedback" role="status" aria-live="polite"></p><section id="feedback-login" class="user-card" hidden><h2>请先登录</h2><p>登录后可以查看同一网络的反馈、提交问题和跟进处理。</p><a class="primary" href="/login?next=/feedback?new=1">登录并提交问题</a><a class="secondary" href="/admin">管理员登录</a></section><div id="feedback-content" hidden><nav class="account-nav user-feedback-nav"><a href="/account">用户中心</a><a href="/account/access">连接启动器</a><a href="/account/friends">好友</a><a href="/feedback" aria-current="page">问题反馈</a></nav><div class="feedback-toolbar"><a id="feedback-admin-link" class="secondary" href="/admin/feedback" hidden>反馈管理</a><nav class="feedback-tabs" aria-label="反馈视图"><button id="show-issues" type="button" aria-selected="true">全部反馈</button><button id="my-issues" type="button" aria-selected="false">我的反馈</button></nav><button class="primary" id="new-issue" type="button">＋ 提交问题</button></div><p id="sync-state"></p><section class="user-card" id="issue-list-panel"><div class="feedback-filters"><label>搜索问题<input id="issue-search" type="search" placeholder="标题、用户名、游戏版本"></label><label>处理状态<select id="issue-filter"><option value="">全部状态</option><option value="open">待受理</option><option value="accepted">已受理</option><option value="investigating">处理中</option><option value="resolved">已完成</option></select></label></div><div id="issue-list"></div><div id="issue-empty" class="empty-state" hidden><strong>还没有问题记录</strong><p>遇到问题？描述现象并附上日志。</p><button id="empty-new-issue" type="button" class="primary">提交第一个问题</button></div><div class="action-buttons"><button id="issues-prev" class="secondary" type="button">上一页</button><span id="issue-page"></span><button id="issues-next" class="secondary" type="button">下一页</button></div></section><form id="issue-create" class="user-card" hidden><h2>提交问题</h2><p>请勿在描述中填写密码或接入码。日志附件仅管理员可下载。</p><label>问题标题<input id="issue-title" maxlength="120" required placeholder="例如：死亡重生后画面卡住约 2 秒"></label><label>问题现象与复现步骤<textarea id="issue-description" rows="6" maxlength="4000" required placeholder="什么时候发生？做了什么？预期与实际表现有什么不同？"></textarea></label><div class="feedback-filters"><label>游戏版本<input id="issue-game" maxlength="64" required placeholder="例如 1.21.1"></label><label>模组加载器与版本<input id="issue-loader" maxlength="120" placeholder="原版 / Fabric / Forge / NeoForge"></label><label>启动器版本<input id="issue-launcher" maxlength="64"></label><label>操作系统<input id="issue-system" maxlength="120" placeholder="例如 Windows 10 22H2"></label></div><label>日志压缩包（可选）<input id="issue-file" type="file" accept=".zip,.log,.txt,.json"></label><small>支持 ZIP、LOG、TXT、JSON，单文件不超过 20 MiB。</small><progress id="create-progress" max="100" value="0" hidden></progress><p id="create-feedback" role="status"></p><button class="primary" type="submit">提交问题</button></form><section id="issue-detail" hidden><article class="user-card"><span id="detail-status" class="identity-badge"></span><h2 id="detail-title"></h2><p id="detail-meta"></p><p id="detail-description" class="issue-prose"></p><dl id="detail-versions"></dl><h3>日志附件</h3><div id="detail-attachments"></div><form id="attachment-form" hidden><label>上传日志文件<input id="attachment-file" type="file" accept=".log,.txt,.json,.zip" required></label><button class="secondary" type="submit">上传日志</button><progress id="upload-progress" max="100" value="0" hidden></progress><p id="upload-feedback" role="status"></p></form></article><article class="user-card"><h2>处理记录与讨论</h2><div id="issue-history"></div><form id="comment-form"><label>补充说明<textarea id="comment-text" rows="3" maxlength="4000" required></textarea></label><button class="secondary" type="submit">发布回复</button></form></article><form id="status-form" class="user-card" hidden><h2>处理问题</h2><label>处理状态<select id="status-value"><option value="accepted">已受理</option><option value="investigating">处理中</option><option value="resolved">已完成</option></select></label><label>处理或修复说明<textarea id="status-message" rows="3" maxlength="4000" required placeholder="记录处理结果、修复版本或验证情况"></textarea></label><p>标记完成后删除日志附件，保留问题与处理记录。</p><button class="primary" type="submit">保存处理记录</button></form></section></div></div></div></main></body></html>
