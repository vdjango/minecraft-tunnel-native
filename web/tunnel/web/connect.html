<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>连接启动器 · Buggcraft</title><script src="/theme.js"></script><link rel="stylesheet" href="/portal.css"><link rel="stylesheet" href="/console.css"><link rel="stylesheet" href="/theme.css"><script src="/common.js" defer></script><script src="/connect.js" defer></script></head><body class="user-site">{{SITE_HEADER}}<main class="shell user-main"><div class="page-heading"><h1>连接启动器</h1><p>选择账号连接，或以访客身份加入房间。</p></div><div class="connect-options"><section class="user-card"><span class="identity-badge">推荐</span><h2>使用我的账号</h2><p>连接你的个人身份，保留好友与房间功能。</p><ol class="auth-steps"><li>登录 Buggcraft 账号</li><li>生成启动器接入码</li><li>粘贴到启动器的「添加节点」</li></ol><div class="auth-switch"><a class="primary" href="/login?next=/account/access">登录并连接</a><a class="secondary" href="/register?next=/account/access">注册账号</a></div></section><section class="user-card" id="connect-dialog"><form id="connect-form"><h2>访客连接</h2><p>无需账号即可加入房间，好友功能需要登录。</p><label id="access-label">节点访问密码<input id="access-password" type="password" autocomplete="off" maxlength="256" placeholder="向管理员获取"></label><label>接入码类型<select id="access-code-format"><option value="1">兼容当前启动器</option><option value="2">新版桥 · 随机接入码</option></select></label><button class="secondary wide" type="submit">生成访客接入码</button><div id="connect-result" class="code-output" hidden><label>启动器接入码<textarea id="player-code" readonly rows="4"></textarea></label><button id="copy-code" class="primary" type="button">复制接入码</button></div><p class="feedback" id="connect-feedback" role="status"></p></form></section></div></main></body></html>
