<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>连接诊断 · 节点管理 · Buggcraft</title><script src="/theme.js?v=3a44bce47cf8"></script><link rel="stylesheet" href="/portal.css?v=8ef5d354e133"><link rel="stylesheet" href="/console.css?v=f858f513caf4"><link rel="stylesheet" href="/theme.css?v=0a92f09ce4a3"><script type="module" src="/vue-page-diagnostics.js?v=0646c09e6123"></script><link rel="modulepreload" href="/vue-runtime-BbySqhPT.js"></head><body class="user-site">{{SITE_HEADER}}<main class="shell user-main"><div class="{{LAYOUT_CLASS}}">{{ADMIN_NAV}}<div class="management-main"><div class="page-heading"><span class="eyebrow">CONNECTION DIAGNOSTICS</span><h1>连接诊断</h1><p>查看断开原因、拥塞和异常时间点。</p></div><p id="diagnostic-feedback" class="feedback" role="status"></p><form id="diagnostic-login" class="user-card" hidden><h2>管理员登录</h2><label>管理员用户名<input id="username" value="admin" autocomplete="username" required></label><label>密码<input id="password" type="password" autocomplete="current-password" required></label><button class="primary" type="submit">登录</button></form><section id="diagnostic-panel" hidden><div class="user-card"><label>查找玩家<input id="player-filter" type="search" placeholder="用户名或匿名会话"></label><label>连接记录<select id="session-select"></select></label><p id="journal-health"></p><small>诊断记录按 7 天及容量上限轮转，关键事件优先保留，不包含游戏正文。</small></div><div id="session-detail" hidden><section class="user-card"><h2 id="session-title"></h2><p id="session-meta"></p><div class="diagnostic-metrics"><div><small>上传峰值 · MB/s</small><strong id="peak-upload">—</strong></div><div><small>下载峰值 · MB/s</small><strong id="peak-download">—</strong></div><div><small>节点调度延迟峰值 · ms</small><strong id="peak-lag">—</strong></div><div><small>游戏状态往返峰值 · ms</small><strong id="peak-rtt">—</strong></div></div><p id="findings" class="diagnostic-summary"></p><h3>异常时间点</h3><div id="diagnostic-alerts" class="action-buttons"></div></section><section class="user-card"><div class="section-heading"><h2>流量时间线</h2><button id="export-diagnostics" class="secondary" type="button">导出当前记录</button></div><canvas id="traffic-chart" height="180" aria-label="上传深紫色、下载浅紫色，单位 MB/s"></canvas><p>深紫色：上传　浅紫色：下载。P2P 数据不经过节点。</p><label>回看时间<input id="replay-position" type="range" min="0" max="0" value="0"></label><div class="action-buttons"><button id="replay-toggle" class="secondary" type="button">播放时间线</button><span id="replay-time"></span></div><details><summary>查看当前采样原始记录</summary><pre id="sample-detail" class="sample-detail"></pre></details></section><section class="user-card"><h2>连接事件</h2><div id="event-list"></div></section></div></section></div></div></main></body></html>
