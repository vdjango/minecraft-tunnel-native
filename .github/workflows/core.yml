name: Native core and bridge
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  protocol:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate version and build tooling
        id: release
        shell: bash
        run: |
          python scripts/release_assets.py version --github-output "$GITHUB_OUTPUT"
          python -m unittest tests.test_build_tools tests.test_release_assets -v
      - name: Ubuntu build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev libcurl4-openssl-dev ninja-build dpkg-dev
      - name: Windows OpenSSL
        if: runner.os == 'Windows'
        shell: pwsh
        run: vcpkg install openssl:x64-windows 'curl[openssl]:x64-windows'
      - name: macOS OpenSSL
        if: runner.os == 'macOS'
        run: brew install openssl@3
      - run: python scripts/fetch_deps.py
      - name: Configure Ubuntu
        if: runner.os == 'Linux'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Configure Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows 2>&1 | Tee-Object -FilePath windows-configure.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Configure macOS
        if: runner.os == 'macOS'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)"
      - name: Build native runtime
        run: python -u scripts/build_native.py
      - run: ctest --test-dir build --build-config Release --output-on-failure
      - run: cmake --install build --config Release --prefix package
      - run: python -m pip install -r requirements.txt
      - name: Windows protocol checks
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PATH = "$pwd/package/bin;" + $env:PATH
          $env:BUGGCRAFT_NATIVE_CORE = "$pwd/package/bin/buggcraft-core.exe"
          $env:BUGGCRAFT_BRIDGE_EXECUTABLE = "$pwd/package/bin/buggcraft-bridge.exe"
          $env:BUGGCRAFT_BRIDGE_LIBRARY = "$pwd/package/bin/buggcraft_bridge.dll"
          $env:BUGGCRAFT_BRIDGE_PACKAGE = "$pwd/package"
          $env:BUGGCRAFT_BRIDGE_SOAK_LOG_DIR = "$pwd/build/protocol-player-logs"
          python -u -m unittest tests.test_bridge_library.LibraryAbiTests -v 2>&1 | Tee-Object -FilePath windows-library-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -u -m unittest tests.test_native tests.test_bridge tests.test_bridge_services tests.test_bridge_library tests.test_peer_reconnect tests.test_peer_heartbeat tests.test_peer_signaling_attempt tests.test_peer_stun_fallback tests.test_ipv4_p2p tests.test_relay_handshake tests.test_resource_metadata tests.test_room_lobby tests.test_route_selection tests.test_node_health tests.test_player_logs tests.test_profile_exchange tests.test_federation_budget tests.test_federation_scale tests.test_federation_lookup tests.test_federation_resilience tests.test_federation_chain -v 2>&1 | Tee-Object -FilePath windows-protocol-tests.log
          $testStatus = $LASTEXITCODE
          if ($testStatus -ne 0) { exit $testStatus }
          python -u scripts/check_compatibility.py 2>&1 | Tee-Object -FilePath windows-compatibility.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Unix protocol checks
        if: runner.os != 'Windows'
        run: |
          export BUGGCRAFT_NATIVE_CORE="$PWD/package/bin/buggcraft-core"
          export BUGGCRAFT_BRIDGE_EXECUTABLE="$PWD/package/bin/buggcraft-bridge"
          export BUGGCRAFT_BRIDGE_PACKAGE="$PWD/package"
          export BUGGCRAFT_BRIDGE_SOAK_LOG_DIR="$PWD/build/protocol-player-logs"
          if [ "$(uname)" = "Darwin" ]; then
            export BUGGCRAFT_BRIDGE_LIBRARY="$PWD/package/lib/libbuggcraft_bridge.dylib"
          else
            export BUGGCRAFT_BRIDGE_LIBRARY="$PWD/package/lib/libbuggcraft_bridge.so"
          fi
          python -u -m unittest tests.test_native tests.test_bridge tests.test_bridge_services tests.test_bridge_library tests.test_peer_reconnect tests.test_peer_heartbeat tests.test_peer_signaling_attempt tests.test_peer_stun_fallback tests.test_ipv4_p2p tests.test_relay_handshake tests.test_resource_metadata tests.test_room_lobby tests.test_route_selection tests.test_node_health tests.test_player_logs tests.test_profile_exchange tests.test_federation_budget tests.test_federation_scale tests.test_federation_lookup tests.test_federation_resilience tests.test_federation_chain -v 2>&1 | tee unix-protocol-tests.log
          test_status=${PIPESTATUS[0]}
          if [ "$test_status" -ne 0 ]; then exit "$test_status"; fi
          python -u scripts/check_compatibility.py 2>&1 | tee unix-compatibility.log
          test_status=${PIPESTATUS[0]}
          if [ "$test_status" -ne 0 ]; then exit "$test_status"; fi
      - name: Describe failed protocol assertions
        if: failure()
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          for name in ('windows-library-tests.log', 'windows-protocol-tests.log', 'windows-compatibility.log',
                       'unix-protocol-tests.log', 'unix-compatibility.log'):
              file = Path(name)
              if not file.is_file():
                  continue
              text = file.read_text(encoding='utf-8-sig', errors='replace')
              for match in re.finditer(r'^(?:FAIL|ERROR): .+', text, re.M):
                  end = text.find('\n======================================================================', match.end())
                  detail = text[match.start():end if end >= 0 else len(text)][:4500]
                  detail = detail.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print('::error title=Native regression assertion::' + detail)
          PY
      - name: Build Ubuntu installer
        if: runner.os == 'Linux'
        run: python scripts/build_deb.py --runtime package --version '${{ steps.release.outputs.deb_version }}'
      - name: Test Ubuntu package installation and reinstall
        if: runner.os == 'Linux'
        run: |
          package_name=$(basename build/debian/*.deb)
          docker run --rm -e BUGGCRAFT_DEB_NAME="$package_name" \
            -v "$PWD/build/debian:/packages:ro" \
            -v "$PWD/tests/debian_smoke.py:/validate.py:ro" ubuntu:24.04 sh -ec \
            'apt-get update -qq; apt-get install -y --no-install-recommends "/packages/$BUGGCRAFT_DEB_NAME" systemd; python3 /validate.py'
      - name: Archive tested runtime
        run: python scripts/release_assets.py package --runner '${{ matrix.os }}' --version '${{ steps.release.outputs.version }}'
      - name: Stage Ubuntu release installer
        if: runner.os == 'Linux'
        run: cp build/debian/*.deb build/debian/*.deb.sha256 build/release-assets/
      - name: Retain release archives
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: build/release-assets/*
          if-no-files-found: error
      - name: Publish Ubuntu installer
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: buggcraft-node-ubuntu24.04-amd64
          path: build/debian/*
          if-no-files-found: error
      - name: Publish complete native runtime
        uses: actions/upload-artifact@v4
        with:
          name: buggcraft-native-${{ matrix.os }}
          path: package/
          if-no-files-found: error
      - name: Retain failed build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-build-diagnostics-${{ matrix.os }}
          path: |
            native-build.log
            windows-configure.log
            build/CMakeCache.txt
            build/install-runtime-*.cmake
            build/CMakeFiles/CMakeConfigureLog.yaml
            build/Testing/Temporary/LastTest.log
            windows-protocol-tests.log
            windows-compatibility.log
            windows-library-tests.log
            unix-protocol-tests.log
            unix-compatibility.log
            package/bin/
            build/protocol-player-logs/
          if-no-files-found: warn

  release:
    needs: protocol
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate release version
        id: release
        run: python scripts/release_assets.py version --github-output "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Verify all platforms and installer checksums
        run: python scripts/release_assets.py verify --version '${{ steps.release.outputs.version }}'
      - name: Publish complete GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          options=(--verify-tag --title "Minecraft Tunnel Native $RELEASE_TAG" --generate-notes)
          if [[ "$RELEASE_TAG" == *-* ]]; then options+=(--prerelease); fi
          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [[ "$draft" != true ]]; then
              echo 'Release already published; refusing to overwrite its assets.' >&2
              exit 1
            fi
            gh release upload "$RELEASE_TAG" release/* --clobber
          else
            gh release create "$RELEASE_TAG" release/* "${options[@]}" --draft
          fi
          if [[ "$RELEASE_TAG" == v0.3.4 ]]; then
            stale_assets=(
              buggcraft-bridge-api-tests.exe buggcraft-bridge-engine.lib
              buggcraft-bridge.exe buggcraft-core.exe buggcraft-native-tests.exe
              buggcraft-protocol-data-tests.exe buggcraft_bridge.dll buggcraft_bridge.exp
              buggcraft_bridge.lib datachannel.dll libcrypto-3-x64.dll
              libssl-3-x64.dll ssh.dll
            )
            existing_assets=$(gh release view v0.3.3 --json assets --jq '.assets[].name')
            for asset in "${stale_assets[@]}"; do
              if grep -Fxq "$asset" <<< "$existing_assets"; then
                gh release delete-asset v0.3.3 "$asset" --yes
              fi
            done
          fi
          gh release edit "$RELEASE_TAG" --draft=false
