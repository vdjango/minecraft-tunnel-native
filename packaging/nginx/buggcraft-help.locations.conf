# Include in the bugg.icu HTTPS server with root /opt/buggcraft-site.
# Canonical tutorial URLs have no trailing slash; unknown articles return 404.
location = /docs {
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
    try_files /docs/index.html =404;
}
location /docs/ {
    rewrite ^(.+)/$ $1 permanent;
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
    try_files $uri/index.html =404;
}
