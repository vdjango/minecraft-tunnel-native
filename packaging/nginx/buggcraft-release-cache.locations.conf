location = /releases.json {
    # Old website bundles must use the same ZIP-only listing as the current UI.
    add_header Cache-Control "no-store" always;
    return 302 /api/launcher/releases;
}

location ~ ^/release-cache/v?(?<legacy_release>[0-9][A-Za-z0-9._-]*)/(?<legacy_program>Buggcraft[.]exe|Buggcraft|Buggcraft-linux-arm64)$ {
    add_header Cache-Control "no-store" always;
    return 302 /api/launcher/assets/$legacy_release/$legacy_program;
}

location = /release-cache/v0.0.1-alphav1.0-beta.0/BUGG-Windows-amd64-0.0.1.exe {
    add_header Cache-Control "no-store" always;
    return 302 /browser-packages/v0.0.1-alphav1.0-beta.0/BUGG-Windows-amd64-0.0.1.zip;
}

location ^~ /browser-packages/ {
    default_type application/zip;
    add_header Content-Disposition "attachment" always;
    add_header Cache-Control "public, max-age=86400" always;
    try_files $uri =404;
}

location /release-cache/ {
    default_type application/octet-stream;
    add_header Content-Disposition "attachment" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
}
