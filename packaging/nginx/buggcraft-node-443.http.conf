# Include in Nginx's http {} context; pair with the stream configuration.
# The node's web backend listens on 127.0.0.1:18443 and trusts 127.0.0.1/32.
server {
    listen 127.0.0.1:18445 ssl proxy_protocol;
    server_name _;
    ssl_certificate /var/lib/buggcraft-node/web-cert.pem;
    ssl_certificate_key /var/lib/buggcraft-node/web-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;

    location / {
        proxy_pass https://127.0.0.1:18443;
        proxy_ssl_trusted_certificate /var/lib/buggcraft-node/web-cert.pem;
        proxy_ssl_verify on;
        proxy_ssl_name localhost;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
