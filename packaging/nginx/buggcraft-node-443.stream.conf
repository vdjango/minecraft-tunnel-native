# Include inside nginx.conf's top-level stream {} block.
# Requires ngx_stream_module and ngx_stream_ssl_preread_module.
# Pair with buggcraft-node-443.http.conf to retain each web client's address.
map $ssl_preread_protocol $buggcraft_node_backend {
    ""      127.0.0.1:13333;
    default 127.0.0.1:18445;
}

server {
    listen 443;
    ssl_preread on;
    proxy_protocol on;
    proxy_pass $buggcraft_node_backend;
    proxy_connect_timeout 5s;
    proxy_timeout 1h;
}

# Consume PROXY metadata before forwarding the unchanged SSH byte stream.
server {
    listen 127.0.0.1:13333 proxy_protocol;
    proxy_pass 127.0.0.1:3333;
    proxy_connect_timeout 5s;
    proxy_timeout 1h;
}
